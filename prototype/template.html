<style>
/* Layout: a workshop price board. Hero pairs the pitch with a live bay schedule; the rest reads like job paperwork. */
:root {
  --bg: #edeff0;
  --surface: #f8f9f9;
  --ink: #11181c;
  --muted: #56636b;
  --line: #cdd4d8;
  --accent: #0b5f66;
  --accent-ink: #ffffff;
  --signal: #c2410c;
  --ok: #1f7a4d;
  --font-display: "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1316; --surface: #151c20; --ink: #e9eef0; --muted: #93a1a9; --line: #26323a;
    --accent: #3db5be; --accent-ink: #05191b; --signal: #ff8a3d; --ok: #55c58d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1316; --surface: #151c20; --ink: #e9eef0; --muted: #93a1a9; --line: #26323a;
  --accent: #3db5be; --accent-ink: #05191b; --signal: #ff8a3d; --ok: #55c58d; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .015em; line-height: 1.08; margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: clamp(2.5rem, 7vw, 4.6rem); }
h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { width: min(1160px, 100%); margin-inline: auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 .78rem/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

/* Prototype strip */
.proto { background: var(--ink); color: var(--bg); font: 500 .8rem/1.4 var(--font-mono); padding: 8px 0; }
.proto .wrap { display: flex; gap: 8px 20px; flex-wrap: wrap; justify-content: space-between; }

/* Header */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.head .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 600 1.25rem/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.mark { width: 36px; height: 36px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 1rem/1 var(--font-display); clip-path: polygon(0 0, 78% 0, 100% 22%, 100% 100%, 0 100%); }
.brand small { display: block; font: 500 .6rem/1 var(--font-mono); letter-spacing: .14em; color: var(--muted); margin-top: 3px; }
.nav { display: flex; gap: 22px; margin-left: auto; font-size: .92rem; color: var(--muted); }
.nav a { text-decoration: none; padding: 6px 0; }
.nav a:hover { color: var(--ink); }
.tools { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; border: 1px solid var(--line); }
.lang button { background: none; border: 0; padding: 6px 9px; font: 600 .75rem/1 var(--font-mono); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.phone-chip { font: 600 .85rem/1 var(--font-mono); text-decoration: none; padding: 9px 12px; border: 1px solid var(--line); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 13px 22px; font: 600 .95rem/1 var(--font-body); cursor: pointer; text-decoration: none; transition: filter .15s; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.sm { padding: 8px 14px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* Hero */
.hero { padding-block: clamp(40px, 7vw, 88px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
.hero h1 em { font-style: normal; color: var(--accent); }
.lede { color: var(--muted); font-size: 1.1rem; max-width: 34em; margin-top: 18px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 34px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); list-style: none; }
.facts li { font: 500 .85rem/1.3 var(--font-mono); color: var(--muted); }
.facts b { display: block; color: var(--ink); font-size: 1.05rem; }

.board { background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.board header { padding: 16px 18px 0; display: grid; gap: 10px; }
.board header div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.board h3 { font-size: 1.05rem; }
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.day { flex: 0 0 auto; background: none; border: 1px solid var(--line); padding: 7px 11px; font: 600 .78rem/1.2 var(--font-mono); cursor: pointer; text-align: center; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 16px 18px; }
.slot { border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 10px 0; font: 600 .9rem/1 var(--font-mono); cursor: pointer; }
.slot:hover { background: var(--accent); color: var(--accent-ink); }
.slot[disabled] { border: 1px dashed var(--line); color: var(--muted); text-decoration: line-through; cursor: not-allowed; background: none; opacity: .75; }
.board footer { padding: 0 18px 16px; font: 500 .75rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.key::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid var(--accent); vertical-align: -1px; }
.key.off::before { border: 1px dashed var(--muted); }

/* Sections */
.section { padding-block: clamp(44px, 7vw, 84px); }
.section.alt { background: var(--surface); border-block: 1px solid var(--line); }
.sec-head { display: grid; gap: 10px; margin-bottom: 30px; max-width: 46em; }
.sec-head p { color: var(--muted); }

/* Price board */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.tab { background: none; border: 1px solid var(--line); padding: 10px 18px; cursor: pointer; font: 600 .85rem/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tab-note { color: var(--muted); margin-bottom: 8px; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 22px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
.row .name { font: 600 1.08rem/1.25 var(--font-body); }
.row .desc { grid-column: 1; color: var(--muted); font-size: .92rem; }
.row .price { font: 600 1.05rem/1 var(--font-mono); color: var(--signal); white-space: nowrap; grid-column: 2; grid-row: 1; text-align: right; }
.row .time { font: 500 .8rem/1 var(--font-mono); color: var(--muted); grid-column: 2; grid-row: 2; text-align: right; }
.row .btn { grid-column: 3; grid-row: 1 / span 2; }

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; counter-reset: s; border: 1px solid var(--line); background: var(--bg); }
.steps li { padding: 26px; border-right: 1px solid var(--line); display: grid; gap: 10px; align-content: start; }
.steps li:last-child { border-right: 0; }
.steps li::before { counter-increment: s; content: "0" counter(s); font: 600 .85rem/1 var(--font-mono); color: var(--accent); }
.steps p { color: var(--muted); }

/* Why */
.why { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px; }
.why div { padding: 22px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.why p { color: var(--muted); }

/* Booking */
.book { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 60px); align-items: start; }
.form { background: var(--surface); border: 1px solid var(--line); padding: clamp(18px, 3vw, 28px); display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.f { display: grid; gap: 6px; min-width: 0; }
.f label { font: 600 .72rem/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; padding: 12px 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 0; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.f .plate { font: 600 1.05rem/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.err { color: var(--signal); font-size: .9rem; min-height: 1.2em; }
.sample { color: var(--muted); font-size: .82rem; }

.ticket { margin-top: 4px; border: 2px solid var(--ink); background: var(--bg); padding: 0; }
.ticket-top { background: var(--ink); color: var(--bg); padding: 10px 16px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 600 .8rem/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.ticket dl { margin: 0; padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; }
.ticket dt { font: 500 .75rem/1.6 var(--font-mono); color: var(--muted); text-transform: uppercase; }
.ticket dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.ticket-foot { border-top: 2px dashed var(--line); padding: 12px 16px; color: var(--muted); font-size: .85rem; }

/* Bot */
.bot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 60px); align-items: center; }
.phone { width: min(360px, 100%); margin-inline: auto; border: 1px solid var(--line); background: var(--surface); display: grid; }
.phone-bar { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-weight: 600; }
.phone-bar .mark { width: 28px; height: 28px; font-size: .8rem; }
.chat { padding: 16px; display: grid; gap: 8px; background: var(--bg); }
.msg { max-width: 86%; padding: 9px 12px; font-size: .92rem; line-height: 1.4; background: var(--surface); border: 1px solid var(--line); }
.msg.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--accent); color: var(--accent); padding: 6px 10px; font: 600 .78rem/1 var(--font-mono); }
.bot ul { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.bot li { padding-left: 22px; position: relative; color: var(--muted); }
.bot li::before { content: ""; position: absolute; left: 0; top: .55em; width: 10px; height: 2px; background: var(--accent); }

/* FAQ */
.faq { max-width: 780px; }
details { border-top: 1px solid var(--line); padding: 18px 0; }
details:last-child { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 500 1.3rem/1 var(--font-mono); color: var(--accent); }
details[open] summary::after { content: "−"; }
details p { color: var(--muted); margin-top: 10px; }

/* Contacts */
.contacts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 60px); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 24px; margin: 24px 0 0; }
.kv dt { font: 500 .78rem/1.7 var(--font-mono); text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.kv a { color: var(--accent); font-family: var(--font-mono); font-weight: 600; }
.sched { border: 1px solid var(--line); background: var(--surface); padding: 22px; align-self: start; }
.sched table { width: 100%; border-collapse: collapse; margin-top: 14px; font: 500 .9rem/1 var(--font-mono); }
.sched td { padding: 11px 0; border-top: 1px solid var(--line); }
.sched td:last-child { text-align: right; }
.sched .closed td:last-child { color: var(--muted); }

footer.site { padding-block: 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
footer.site .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@media (max-width: 900px) {
  .hero .wrap, .book, .bot, .contacts { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .tools { margin-left: auto; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .steps li { border-right: 0; border-bottom: 1px solid var(--line); }
  .steps li:last-child { border-bottom: 0; }
  .why { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .phone-chip { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
  .row .name { grid-column: 1 / -1; grid-row: 1; }
  .row .price { grid-column: 1; grid-row: 2; text-align: left; }
  .row .time { grid-column: 2; grid-row: 2; }
  .row .desc { grid-column: 1 / -1; grid-row: 3; }
  .row .btn { grid-column: 1 / -1; grid-row: 4; justify-self: start; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .slots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }
</style>

const $ = (id) => document.getElementById(id);
const LANGS = ['ru', 'uz', 'en'];
const pad = (n) => String(n).padStart(2, '0');
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
let lang = 'ru', category = 'service', activeDay = null, picked = { date: '', time: '' };

const T = () => Object.assign({}, BASE[lang], EXTRA[lang]);

/* ----- slots: deterministic "busy" pattern so the prototype looks lived-in ----- */
const SLOT_TIMES = []; for (let h = BUSINESS.openHour; h < BUSINESS.closeHour; h++) SLOT_TIMES.push(pad(h) + ':00');
function isoLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function workDays() {
  const out = [], d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; out.length < 6 && i < 14; i++) { const x = new Date(d); x.setDate(d.getDate() + i); if (BUSINESS.workDays.includes(x.getDay())) out.push(x); }
  return out;
}
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822519)) >>> 0) / 4294967296; }
const booked = new Set();
function isBusy(date, time) {
  if (booked.has(date + time)) return true;
  const r = seeded(date + time)();
  return r < 0.38;
}
function freeSlots(date) {
  const now = new Date(), today = isoLocal(now), mins = now.getHours() * 60 + now.getMinutes();
  return SLOT_TIMES.filter((t) => {
    if (isBusy(date, t)) return false;
    if (date !== today) return true;
    const [h, m] = t.split(':').map(Number); return h * 60 + m > mins + 30;
  });
}
const dayLabel = (d, short) => short
  ? T().days[d.getDay()] + ' ' + d.getDate()
  : d.toLocaleDateString(T().locale, { weekday: 'short', day: 'numeric', month: 'long' });

/* ----- renderers ----- */
function renderStatic() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = 'Garage Detailing';
  document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t[n.dataset.t]; });
  $('protoA').textContent = t.protoA; $('protoB').textContent = t.protoB;
  $('brandSub').textContent = t.brandSub;
  $('heroEyebrow').textContent = t.heroEyebrow;
  $('heroTitle').innerHTML = t.heroTitle;
  $('heroText').textContent = t.heroText;
  $('facts').innerHTML = t.facts.map((f) => '<li><b>' + f[0] + '</b>' + f[1] + '</li>').join('');
  $('steps').innerHTML = t.how.map((s) => '<li><h3>' + s[1] + '</h3><p>' + s[2] + '</p></li>').join('');
  $('why').innerHTML = t.why.map((w) => '<div><h3>' + w[1] + '</h3><p>' + w[2] + '</p></div>').join('');
  $('botList').innerHTML = t.botList.map((x) => '<li>' + x + '</li>').join('');
  $('chat').innerHTML = t.chat.map((m) => m[0] === 'chips'
    ? '<div class="chips">' + m[1].map((c) => '<span class="chip">' + c + '</span>').join('') + '</div>'
    : '<div class="msg ' + (m[0] === 'me' ? 'me' : '') + '">' + m[1] + '</div>').join('');
  $('faqList').innerHTML = t.faq.map((q) => '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>').join('');
  $('kv').innerHTML = '<dt>' + t.kvAddr + '</dt><dd>' + BUSINESS.address[lang] + '</dd>'
    + '<dt>' + t.kvPhone + '</dt><dd>' + BUSINESS.phonesDisplay.map((p, i) => '<a href="tel:' + BUSINESS.phones[i] + '">' + p + '</a>').join('<br>') + '</dd>'
    + '<dt>' + t.kvHours + '</dt><dd>' + BUSINESS.hours[lang] + '</dd>'
    + '<dt>' + t.kvLang + '</dt><dd>' + t.kvLangV + '</dd>';
  $('mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(BUSINESS.mapQuery);
  $('sched').innerHTML = t.hoursDays.map((r, i) => '<tr class="' + (i ? 'closed' : '') + '"><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
  $('footNote').textContent = t.footNote;
  $('yr').textContent = new Date().getFullYear();
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

function renderDays() {
  const days = workDays();
  if (!activeDay) activeDay = isoLocal(days[0]);
  $('days').innerHTML = days.map((d) => {
    const iso = isoLocal(d);
    return '<button type="button" class="day" data-day="' + iso + '" aria-pressed="' + (iso === activeDay) + '">' + dayLabel(d, true) + '</button>';
  }).join('');
  renderSlots();
}
function renderSlots() {
  const free = new Set(freeSlots(activeDay));
  $('slots').innerHTML = SLOT_TIMES.map((t) => '<button type="button" class="slot" data-time="' + t + '"' + (free.has(t) ? '' : ' disabled') + '>' + t + '</button>').join('');
}

function renderTabs() {
  $('tabs').innerHTML = CATALOG.categories.map((c) => '<button type="button" role="tab" class="tab" data-cat="' + c.id + '" aria-selected="' + (c.id === category) + '">' + c.name[lang] + '</button>').join('');
  $('tabNote').textContent = T().tabNote[category];
  const t = T();
  $('rows').innerHTML = CATALOG.services.filter((s) => s.category === category).map((s) => {
    const dur = s.minutes >= 60 ? (s.minutes / 60).toFixed(1).replace('.0', '') + ' ' + t.hour : s.minutes + ' ' + t.min;
    return '<li class="row"><span class="name">' + s.name[lang] + '</span>'
      + '<span class="price">' + t.from + ' ' + fmt(s.priceFrom) + ' ' + t.sum + '</span>'
      + '<span class="desc">' + s.desc[lang] + '</span>'
      + '<span class="time">' + dur + '</span>'
      + '<button type="button" class="btn sm ghost" data-book="' + s.id + '">' + t.book + '</button></li>';
  }).join('');
}

function renderForm() {
  const t = T();
  const svc = $('fService').value;
  $('fService').innerHTML = '<option value="">' + t.choose + '</option>' + CATALOG.categories.map((c) =>
    '<optgroup label="' + c.name[lang] + '">' + CATALOG.services.filter((s) => s.category === c.id).map((s) => '<option value="' + s.id + '">' + s.name[lang] + '</option>').join('') + '</optgroup>').join('');
  $('fService').value = svc;
  const date = $('fDate').value || picked.date;
  $('fDate').innerHTML = '<option value="">' + t.choose + '</option>' + workDays().map((d) => '<option value="' + isoLocal(d) + '">' + dayLabel(d, false) + '</option>').join('');
  $('fDate').value = date;
  fillTimes($('fTime').value || picked.time);
}
function fillTimes(keep) {
  const t = T(), date = $('fDate').value;
  const list = date ? freeSlots(date) : [];
  $('fTime').innerHTML = '<option value="">' + (date && !list.length ? t.noSlots : t.choose) + '</option>' + list.map((s) => '<option value="' + s + '">' + s + '</option>').join('');
  if (keep && list.includes(keep)) $('fTime').value = keep;
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('gd-lang', l); } catch (e) { /* storage unavailable */ }
  renderStatic(); renderDays(); renderTabs(); renderForm();
}

/* ----- events ----- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) return setLang(b.dataset.lang);
  if (b.dataset.day) { activeDay = b.dataset.day; return renderDays(); }
  if (b.classList.contains('slot')) {
    picked = { date: activeDay, time: b.dataset.time };
    $('fDate').value = activeDay; fillTimes(picked.time);
    $('book').scrollIntoView(); return $('fService').focus({ preventScroll: true });
  }
  if (b.dataset.cat) { category = b.dataset.cat; return renderTabs(); }
  if (b.dataset.book) { $('fService').value = b.dataset.book; $('book').scrollIntoView(); $('fService').focus({ preventScroll: true }); }
});
$('fDate').addEventListener('change', () => fillTimes(''));

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = T(), f = e.target;
  const v = (n) => f.elements[n].value.trim();
  const digits = v('phone').replace(/\D/g, '');
  const msg = !v('service') ? t.errors.bad_service : !v('date') ? t.errors.bad_date : !v('time') ? t.errors.bad_time
    : v('name').length < 2 ? t.errors.bad_name : !(digits.length === 9 || (digits.length === 12 && digits.startsWith('998'))) ? t.errors.bad_phone : '';
  $('err').textContent = msg;
  if (msg) return;

  const svc = CATALOG.services.find((s) => s.id === v('service'));
  const d = new Date(v('date') + 'T12:00:00');
  booked.add(v('date') + v('time'));
  const no = 'GD-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(1 + Math.floor(Math.random() * 98));
  const phone = '+998 ' + digits.slice(-9).replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, '$1 $2-$3-$4');
  const rows = [[t.tService, svc.name[lang]], [t.tWhen, dayLabel(d, false) + ', ' + v('time')], [t.tClient, v('name')], [t.tPhone, phone]];
  const car = [v('car'), v('plate').toUpperCase()].filter(Boolean).join(' · ');
  if (car) rows.push([t.tCar, car]);
  rows.push([t.tPost, String(1 + (parseInt(v('time'), 10) % 3))], [t.tStatus, t.statusNew]);

  $('tNo').textContent = '№ ' + no;
  $('tBody').innerHTML = rows.map((r) => '<dt></dt><dd></dd>').join('');
  const cells = $('tBody').children;
  rows.forEach((r, i) => { cells[i * 2].textContent = r[0]; cells[i * 2 + 1].textContent = r[1]; });
  $('ticket').hidden = false;
  $('ticket').scrollIntoView({ block: 'nearest' });
  f.reset(); picked = { date: '', time: '' };
  renderForm(); renderSlots();
});

/* ----- init ----- */
(function init() {
  let saved = null;
  try { saved = localStorage.getItem('gd-lang'); } catch (e) { /* ignore */ }
  const nav = (navigator.language || 'ru').slice(0, 2);
  lang = LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'ru';
  setLang(lang);
})();
</script>
